<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>relay</title>
<script>
// temporary: passes encrypted upload blobs to the meb publisher console (removed after use)
addEventListener('message', async e => {
  if (e.origin !== 'https://www.mebmarket.com') return;
  const { sha, name, id } = e.data || {};
  if (!/^[0-9a-f]{40}$/.test(sha) || !/^[a-z]+-(pdf|epub|cover)$/.test(name)) return;
  try {
    const b = await (await fetch(`https://raw.githubusercontent.com/hvc9594852-maker/daidaiphasa/${sha}/${name}.bin`)).arrayBuffer();
    e.source.postMessage({ id, buf: b }, e.origin, [b]);
  } catch (err) { e.source.postMessage({ id, error: String(err) }, e.origin); }
});
parent.postMessage({ ready: true }, 'https://www.mebmarket.com');
</script>
